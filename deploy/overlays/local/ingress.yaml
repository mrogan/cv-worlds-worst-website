# Local only: the shop at http://website.localhost:8080, through the weighted service that splits a release's traffic.
# An IngressRoute rather than an Ingress, because only Traefik's own route can send traffic to a TraefikService.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: website
  namespace: website
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`website.localhost`)
      middlewares:
        - name: visitors
      services:
        - kind: TraefikService
          name: website
---
# What the public sends is a visit: `x-unmeasured` is removed (an empty value removes a header), so only a client in
# the cluster, which asks the Services directly, can keep its requests out of the request metrics (src/measured.ts).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: visitors
  namespace: website
spec:
  headers:
    customRequestHeaders:
      x-unmeasured: ""
