# The shop, released as a canary by Argo Rollouts. A new image starts beside the version it replaces, takes a quarter
# of the traffic, then half, then all of it; at any step it can be rolled back, and the stable version takes it all
# again. Traefik splits the traffic (traffic-split.yaml), with weights Argo Rollouts sets.
#
# Meets the restricted Pod Security Standard: non-root, no privilege escalation, no capabilities.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: website
spec:
  replicas: 1
  strategy:
    canary:
      # Argo Rollouts points each Service at its version's pods, by their rollouts-pod-template-hash label.
      stableService: website
      canaryService: website-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: website
      steps:
        - setWeight: 25
        - pause: { duration: 3m }
        - setWeight: 50
        - pause: { duration: 3m }
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          # Each profile pins the image by digest (kustomize `images:`), so a deploy is always a commit.
          image: website
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.telemetry:4318
            - name: OTEL_SERVICE_NAME
              value: website
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=worlds-worst-website
            # Every 15s rather than the default minute, so rates settle quickly.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
