# Static analysis of the TypeScript and of the workflows themselves.
#
# The analysis lives in Software Factory's repository and is called at a pinned commit, so this repository
# and that one are held to the same queries, and a change here cannot loosen them.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write
    uses: mrogan/cv-software-factory/.github/workflows/codeql.yml@8ecdfb4fc958e069a0b1db7300d698489caabbf8 # main
