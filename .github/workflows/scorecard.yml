# OpenSSF Scorecard: an outside measure of the repository's supply-chain hygiene, published to scorecard.dev.
#
# The analysis lives in Software Factory's repository and is called at a pinned commit.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 6 * * 1'
  branch_protection_rule:

permissions: {}

jobs:
  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results
    uses: mrogan/cv-software-factory/.github/workflows/scorecard.yml@8ecdfb4fc958e069a0b1db7300d698489caabbf8 # main
