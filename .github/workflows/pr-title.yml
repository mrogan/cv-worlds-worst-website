# Pull requests are squash-merged, so the title becomes the commit on main: it must be a Conventional Commit.
#
# The check itself lives in Software Factory's repository and is called at a pinned commit, so this repository
# and that one keep the same rule, and a change here cannot loosen it.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    uses: mrogan/cv-software-factory/.github/workflows/pr-title.yml@02188ee7f832d02f2954c2d4d7895a610f1da75b # main
